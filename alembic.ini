# Configuration Alembic pour Kuma Data Core.
#
# La chaîne de connexion (sqlalchemy.url) n'est PAS définie ici : elle
# est résolue dynamiquement par migrations/env.py à partir du fichier
# .env racine, via kuma_data_core.core.config.Settings.
#
# Voir docs/conventions/02-migrations.md pour les règles applicables
# aux migrations.

[alembic]
# Emplacement des scripts de migration (relatif à la racine du dépôt).
script_location = migrations

# Format des noms de fichiers de migration, conforme à la convention
# YYYY_MM_DD_HHMM_description.py définie dans 02-migrations.md.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Toutes les dates internes Alembic sont en UTC.
timezone = UTC

# Longueur maximale du slug dans le nom de fichier.
truncate_slug_length = 40

# Préfixes de chemin Python pour la résolution des modules.
prepend_sys_path = .

# Le path de version unique (versions/) est calculé par env.py.
version_path_separator = os

# === Logging par défaut Alembic ===
# Le projet introduira structlog à l'étape 4. Pour l'instant on
# conserve la configuration standard Python logging.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
